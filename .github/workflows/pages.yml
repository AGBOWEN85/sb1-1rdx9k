name: Deploy to GitHub Pages

# Native GitHub Pages deployment (GitHub Actions source): build the Vite
# app and publish dist/ to Pages. The --base flag matches the Pages
# subpath; without it, asset URLs resolve to the domain root and 404.
# Runs on the deploy branch (pre-merge preview) and on main (production).
# Requires the repo's Pages source set to "GitHub Actions".

on:
  push:
    branches:
      - main
      - deploy/pages
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for the Pages subpath
        run: npm run build -- --base=/sb1-1rdx9k/

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
